version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["@types/*", "typescript"]
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
      tanstack:
        patterns: ["@tanstack/*"]
    labels:
      - dependencies
      - pnpm
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["actions/*", "pnpm/*"]
    labels:
      - dependencies
      - github-actions
