# Supabase local — Coderhub Hackathon rketggbvlsihiglvzdyq (sa-east-1)
# `npx supabase link --project-ref rketggbvlsihiglvzdyq` + SUPABASE_ACCESS_TOKEN para Preview

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54321
file_size_limit = "50MiB"
import_path = "./seed.sql"

[auth.email.template.magic_link]
subject = "Tu enlace de acceso a Handly"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Te invitaron a colaborar en Handly"
content_path = "./supabase/templates/invite.html"
